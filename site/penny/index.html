<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Penny Jar — a tactile little savings tracker. Drop coins, watch the jar fill, hit your goal.">
<title>Penny Jar — Little Coins, Big Dreams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#fdf6ec;--ink:#4a3b2a;--dim:#9a8468;--gold:#e8a13c;--gold2:#f7c948;
    --glass:rgba(255,255,255,.55);--mint:#5fb878;--rose:#e0655a}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:
    radial-gradient(600px 300px at 15% 0%,rgba(247,201,72,.18),transparent 60%),
    radial-gradient(700px 400px at 90% 100%,rgba(232,161,60,.14),transparent 60%),var(--bg);
    color:var(--ink);min-height:100vh}
  .backlink{position:fixed;top:14px;left:14px;z-index:200;background:rgba(253,246,236,.9);
    color:var(--ink);text-decoration:none;font-weight:600;font-size:.85rem;padding:.55rem .9rem;
    border:1px solid rgba(74,59,42,.25);border-radius:999px;backdrop-filter:blur(6px);transition:.2s}
  .backlink:hover{background:var(--gold);color:#fff;border-color:var(--gold)}
  .wrap{max-width:34rem;margin:0 auto;padding:4.5rem 1.25rem 4rem;text-align:center}
  h1{font-family:'Fredoka',sans-serif;font-size:clamp(2.2rem,7vw,3.2rem);font-weight:700}
  h1 span{color:var(--gold)}
  .sub{color:var(--dim);margin:.5rem 0 1.8rem;font-size:1rem}
  .total{font-family:'Fredoka',sans-serif;font-size:clamp(2.6rem,9vw,3.8rem);font-weight:700;margin-bottom:.2rem;
    font-variant-numeric:tabular-nums}
  .totallabel{color:var(--dim);font-size:.85rem;letter-spacing:.25em;text-transform:uppercase;margin-bottom:1.4rem}

  /* jar */
  .jarzone{position:relative;width:min(19rem,80vw);margin:0 auto 1.6rem}
  .jar{position:relative;width:100%;aspect-ratio:3/4}
  .jarbody{position:absolute;inset:6% 4% 2%;border:.45rem solid #b9a27e;border-top:none;border-radius:0 0 3rem 3rem;
    background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.08));overflow:hidden}
  .jarlid{position:absolute;top:0;left:8%;right:8%;height:9%;background:linear-gradient(180deg,#c8a06a,#a97f4e);
    border-radius:.9rem;box-shadow:0 4px 10px rgba(0,0,0,.15)}
  .jarslot{position:absolute;top:3.4%;left:50%;transform:translateX(-50%);width:38%;height:1.1rem;background:#3a2f22;border-radius:999px}
  .shine{position:absolute;top:12%;left:12%;width:10%;height:60%;background:rgba(255,255,255,.5);border-radius:999px;filter:blur(2px)}
  .coins{position:absolute;left:0;right:0;bottom:0;height:0%;transition:height 1s cubic-bezier(.34,1.4,.44,1);
    background:
      radial-gradient(circle at 20% 30%,rgba(255,240,200,.5) 0 6px,transparent 7px),
      radial-gradient(circle at 65% 60%,rgba(255,240,200,.45) 0 8px,transparent 9px),
      radial-gradient(circle at 40% 80%,rgba(255,240,200,.4) 0 7px,transparent 8px),
      radial-gradient(circle at 80% 20%,rgba(255,240,200,.45) 0 6px,transparent 7px),
      linear-gradient(180deg,#f7c948,#e8a13c 60%,#c97f22);
    border-top:.35rem solid #ffe9ad}
  .splash{position:absolute;left:50%;top:8%;transform:translateX(-50%);font-size:2rem;opacity:0;pointer-events:none}
  .splash.go{animation:splash 1s ease forwards}
  @keyframes splash{
    0%{opacity:1;transform:translate(-50%,-1.5rem) scale(.6)}
    40%{opacity:1;transform:translate(-50%,.4rem) scale(1.15)}
    100%{opacity:0;transform:translate(-50%,1.2rem) scale(.9)}
  }
  .jarshake{animation:shake .5s ease}
  @keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}
  .coinval{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);font-family:'Fredoka',sans-serif;
    font-weight:700;font-size:1.6rem;color:#7a5a1e;opacity:0;pointer-events:none;text-shadow:0 2px 0 rgba(255,255,255,.6)}
  .coinval.go{animation:coinpop 1.1s ease forwards}
  @keyframes coinpop{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}25%{opacity:1;transform:translate(-50%,-14px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-46px) scale(1)}}

  /* controls */
  .dropbtn{font-family:'Fredoka',sans-serif;font-size:1.3rem;font-weight:600;background:linear-gradient(180deg,var(--gold2),var(--gold));
    color:#5a3c10;border:none;border-radius:999px;padding:1rem 2.6rem;cursor:pointer;
    box-shadow:0 8px 0 #b97a1f,0 14px 24px rgba(232,161,60,.4);transition:.12s;margin-bottom:1rem}
  .dropbtn:hover{filter:brightness(1.06)}
  .dropbtn:active{transform:translateY(6px);box-shadow:0 2px 0 #b97a1f}
  .streak{color:var(--dim);font-size:.9rem;margin-bottom:1.8rem;min-height:1.3rem}

  /* goal */
  .goalcard{background:#fff;border:1px solid rgba(74,59,42,.14);border-radius:1.2rem;padding:1.4rem;
    box-shadow:0 10px 30px rgba(74,59,42,.08);text-align:left}
  .goalcard h2{font-family:'Fredoka',sans-serif;font-size:1.2rem;margin-bottom:.9rem}
  .goalrow{display:flex;gap:.6rem;align-items:center;margin-bottom:1rem}
  .goalrow input{flex:1;border:2px solid rgba(74,59,42,.18);border-radius:.7rem;padding:.65rem .9rem;
    font-size:1rem;font-family:inherit;color:var(--ink);outline:none}
  .goalrow input:focus{border-color:var(--gold)}
  .goalrow button{background:var(--ink);color:#fff;border:none;border-radius:.7rem;padding:.65rem 1.1rem;
    font-weight:600;cursor:pointer;font-family:inherit}
  .goalrow button:hover{background:#5c4a34}
  .bar{height:1.1rem;background:#f0e6d2;border-radius:999px;overflow:hidden;margin-bottom:.5rem}
  .bar .fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,var(--gold2),var(--gold));
    transition:width .8s cubic-bezier(.34,1.3,.44,1)}
  .goalmeta{display:flex;justify-content:space-between;font-size:.88rem;color:var(--dim)}
  .goalmeta b{color:var(--ink)}
  .celebrate{margin-top:1rem;background:linear-gradient(135deg,#fff7e0,#ffefc2);border:1px dashed var(--gold);
    border-radius:.9rem;padding:1rem;display:none;text-align:center;font-weight:600}
  .celebrate.show{display:block;animation:pop .5s ease}
  @keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}

  .danger{margin-top:1.6rem;background:none;border:1px solid rgba(224,101,90,.5);color:var(--rose);
    border-radius:.8rem;padding:.7rem 1.4rem;font-weight:600;cursor:pointer;font-family:inherit;transition:.2s}
  .danger:hover{background:var(--rose);color:#fff}
  .log{margin-top:1.6rem;text-align:left;max-height:11rem;overflow-y:auto;background:#fff;
    border:1px solid rgba(74,59,42,.12);border-radius:.9rem;padding:.9rem 1.1rem;font-size:.85rem;color:var(--dim)}
  .log div{padding:.25rem 0;border-bottom:1px dashed rgba(74,59,42,.1)}
  .log div:last-child{border:none}
  .log b{color:var(--gold)}
</style>
</head>
<body>
<a class="backlink" href="../">← 30 Sites</a>
<div class="wrap">
  <h1>Penny <span>Jar</span> 🫙</h1>
  <p class="sub">Every coin counts. Drop one in, watch the jar fill, hit your goal.</p>

  <div class="total" id="total">$0.00</div>
  <div class="totallabel">saved so far</div>

  <div class="jarzone">
    <div class="jar" id="jar">
      <div class="jarbody">
        <div class="coins" id="coins"></div>
        <div class="shine"></div>
      </div>
      <div class="jarlid"></div>
      <div class="jarslot"></div>
      <div class="splash" id="splash">🪙</div>
      <div class="coinval" id="coinval">+25¢</div>
    </div>
  </div>

  <button class="dropbtn" id="drop">🪙 Drop a coin</button>
  <div class="streak" id="streak"></div>

  <div class="goalcard">
    <h2>🎯 Savings goal</h2>
    <div class="goalrow">
      <input type="number" id="goalInput" min="1" step="1" aria-label="Savings goal in dollars">
      <button id="setGoal">Set goal</button>
    </div>
    <div class="bar"><div class="fill" id="goalFill"></div></div>
    <div class="goalmeta"><span><b id="pct">0%</b> of goal</span><span>Goal: <b id="goalLabel">$50</b></span></div>
    <div class="celebrate" id="celebrate">🎉 Goal smashed! Time to dream a little bigger — raise the bar? 🎉</div>
  </div>

  <button class="danger" id="empty">Empty jar (start over)</button>

  <div class="log" id="log" aria-label="Savings history"></div>
</div>

<script>
(function(){
  const KEY="pennyjar_v1";
  let s={total:0,goal:50,log:[],lastDrop:null};
  try{ Object.assign(s, JSON.parse(localStorage.getItem(KEY)||"{}")); }catch(e){}
  const save=()=>localStorage.setItem(KEY,JSON.stringify(s));
  const fmt=c=>"$"+(c/100).toFixed(2);

  const totalEl=document.getElementById("total"), coinsEl=document.getElementById("coins"),
        splash=document.getElementById("splash"), coinval=document.getElementById("coinval"),
        jar=document.getElementById("jar"), streakEl=document.getElementById("streak"),
        logEl=document.getElementById("log");

  function render(){
    totalEl.textContent=fmt(s.total);
    const fillPct=Math.min(100,(s.total/100)/(s.goal||50)*100);
    coinsEl.style.height=Math.min(96,fillPct*0.96)+"%";
    document.getElementById("goalFill").style.width=Math.min(100,fillPct)+"%";
    document.getElementById("pct").textContent=Math.round(fillPct)+"%";
    document.getElementById("goalLabel").textContent="$"+(s.goal||50);
    document.getElementById("goalInput").value=s.goal||50;
    document.getElementById("celebrate").classList.toggle("show",(s.total/100)>=(s.goal||50)&&s.total>0);
    const today=new Date().toDateString();
    const todayDrops=s.log.filter(e=>e.day===today).length;
    streakEl.textContent = todayDrops? `🪙 ${todayDrops} coin${todayDrops>1?"s":""} dropped today — keep the streak alive!` : "No coins yet today. Your future self is waiting…";
    logEl.innerHTML = s.log.length
      ? s.log.slice(-8).reverse().map(e=>`<div>+<b>${e.v}¢</b> — ${e.when}</div>`).join("")
      : "<div>No coins yet. The jar is feeling empty.</div>";
  }

  document.getElementById("drop").addEventListener("click",()=>{
    const v=Math.floor(Math.random()*50)+1; // 1¢–50¢
    s.total+=v;
    const now=new Date();
    s.log.push({v, when:now.toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}), day:now.toDateString()});
    s.log=s.log.slice(-100);
    save(); render();
    coinval.textContent="+"+v+"¢";
    [splash,coinval].forEach(el=>{el.classList.remove("go");void el.offsetWidth;el.classList.add("go");});
    jar.classList.remove("jarshake"); void jar.offsetWidth; jar.classList.add("jarshake");
  });

  document.getElementById("setGoal").addEventListener("click",()=>{
    const g=parseInt(document.getElementById("goalInput").value,10);
    if(g>0){ s.goal=g; save(); render(); }
  });

  document.getElementById("empty").addEventListener("click",()=>{
    if(s.total===0){alert("The jar is already empty!");return;}
    if(confirm(`Empty the jar and start over? You'll lose ${fmt(s.total)} of glorious savings.`)){
      s={total:0,goal:s.goal,log:[],lastDrop:null}; save(); render();
    }
  });

  render();
})();
</script>
</body>
</html>
